<!doctype html>
<!-- DEFAULT THEME SWITCH: change data-default-theme to "light" or "dark".
     This is the only place you need to edit to flip the site's default mode. -->
<html lang="en" data-default-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      // Default comes from <html data-default-theme="…">; a visitor's saved
      // toggle choice (localStorage "theme") overrides it.
      (function () {
        try {
          var def = document.documentElement.getAttribute('data-default-theme') || 'dark';
          var saved = localStorage.getItem('theme'); // 'light' | 'dark' | null
          var isLight = saved ? saved === 'light' : def === 'light';
          if (isLight) {
            document.documentElement.classList.add('light');
            document.addEventListener('DOMContentLoaded', function () {
              var m = document.querySelector('meta[name="theme-color"]');
              if (m) m.setAttribute('content', '#FFFAEE');
            });
          }
        } catch (e) {}
      })();
    </script>
