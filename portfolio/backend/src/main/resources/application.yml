spring:
  application:
    name: pranav-portfolio-api
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /

# AI Chat (Groq — free, fast, no credit card needed)
ai:
  api-key: ${env.GROQ_API_KEY:${GROQ_API_KEY:}}
  model: llama-3.3-70b-versatile
  max-history: 20

logging:
  level:
    root: INFO
    com.pranav: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
